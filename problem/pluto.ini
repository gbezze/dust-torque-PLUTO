[Grid]

X1-grid    1    0.75   160    l+   1.25
X2-grid    1    0.0    180    u    6.283185307
X3-grid    1   -1.0     1    u    1.0

[Chombo Refinement]

Levels           4
Ref_ratio        2 2 2 4
Regrid_interval  200 200 200 200
Refine_thresh    0.3
Tag_buffer_size  3
Block_factor     8
Max_grid_size    32
Fill_ratio       0.5

[Time]

CFL              0.4
CFL_max_var      1.1
tstop           1000.0
first_dt         1.e-5

[Solver]

Solver         hllc

[Boundary]

X1-beg        userdef
X1-end        userdef
X2-beg        periodic
X2-end        periodic
X3-beg        periodic
X3-end        periodic

[Static Grid Output]

uservar    0
output_dir ./out
dbl.h5    -1.0  -1   single_file
dbl      250.0  -1   single_file #disk output
flt       -1.0  -1   single_file
vtk       -1.0  -1   single_file
tab       -1.0  -1
ppm       -1.0  -1
png       -1.0  -1
log       1000
analysis   0.1  -1              #planet output and dust torque

[Particles]

Nparticles          5.e5  -1
particles_dbl      250.0  -1    #dust output
particles_flt       -0.1  -1
particles_vtk       -0.2  -1
particles_tab       -0.1  -1

[Chombo HDF5 output]

Checkpoint_interval  -1.0  0
Plot_interval         20.  0

[Parameters]

M_CO                        1.0   # Mass of star [Solar mass]
SIGMA_0                     1000  # Surface density at 1 AU [g/cm^2]
P_INDEX                     0.5   # density exponent
Q_INDEX                     1.001 # temperature exponent
ALPHA                       3.e-3 # alpha viscosity parameter
ASPECT_RATIO                0.05  # constant disk aspect ratio (H/r)
MEAN_MOLECULAR_WEIGTH       2.3   # gas mean molecular weight [amu]
DAMPING_INNER               1.1   # r_inner_dust/r_inner_gas
DAMPING_OUTER               0.9   # r_outer_dust/r_outer_gas
DUST_DENSITY                2.0   # dust grain density [g/cm^3]
N_BIN_DUST                  30    # number of dust size bins
DUST_SIZE_MIN               0.5   # minimum dust radius [cm]
DUST_SIZE_MAX               20    # maximum dust radius [cm]
DUST_SMOOTHING_FACTOR       -1  # planet potential smoothing length for dust [gas scale height] (if -1 uses 0.7 dust scale height, if -2 uses Hill radius)
DUST_ACCRETION_TIMESCALE    0.1   # dust accretion timescale [2pi/OmegaK], set to -1 for no accretion, if <<1 removes all dust in hill sphere
TORQUE_EXCLUSION_RADIUS     1     # radius below which particles are excluded from torque calculation [Hill radius]
X_PLANET                    1.    # this is needed for syncing the planet-dust timestep, the value is irrelevant (not elegant, maybe works)
Y_PLANET                    1.    # this is needed for syncing the planet-dust timestep, the value is irrelevant (not elegant, maybe works)